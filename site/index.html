<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<!-- viewport-fit=cover lets the tab bar sit above the home indicator instead of under it. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"/>
<meta name="description" content="Liquid Glass UI — 遵循 Apple 设计语言的 React 组件系统与文档站"/>
<title>Liquid Glass UI</title>
<!-- data-csp-nonce is replaced with a real per-response nonce by scripts/serve-preview.mjs,
     so this inline script runs under `script-src 'self' 'nonce-…'` without weakening the policy. -->
<script data-csp-nonce>
  /* Applied before first paint: reading the preference after hydration is what produces the
     flash of the wrong theme, and it is also why a system dark-mode user would see light. */
  (function () {
    try {
      var stored = localStorage.getItem('lg-docs-theme') || 'system';
      var dark = stored === 'dark' || (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.dataset.appTheme = dark ? 'dark' : 'light';
      root.setAttribute('data-lg-theme', dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
      var size = localStorage.getItem('lg-docs-text-size');
      if (size) root.dataset.lgTextSize = size;
    } catch (error) { /* private mode: fall back to the system appearance */ }
  })();
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
