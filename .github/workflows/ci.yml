name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build the package
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # Runs against dist/, so it checks what actually gets published.
      - name: Server-side rendering
        run: pnpm test:ssr

      - name: Build the documentation site
        run: pnpm build:site

      # The real Chrome channel, not bundled Chromium: the refraction path depends on it.
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Browser tests
        run: pnpm test:chrome

      - name: Size report
        run: pnpm size

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            reports/
            test-results/
          retention-days: 14
