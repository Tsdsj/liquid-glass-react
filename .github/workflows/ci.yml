name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this so a tag is verified by exactly the same job that
  # verifies main, rather than by a second copy that can drift away from it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the "packageManager" field, so the runner and a
      # developer's machine cannot end up on different resolvers.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build the package
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      # Runs against dist/, so it checks what actually gets published.
      - name: Server-side rendering
        run: pnpm test:ssr

      - name: Build the documentation site
        run: pnpm build:site

      # The real Chrome channel, not bundled Chromium: the refraction path depends on it.
      - name: Install Chrome
        run: pnpm exec playwright install --with-deps chrome

      - name: Browser tests
        run: pnpm test:chrome

      # Safari and Firefox have no SVG-backdrop lensing. These check that what is left is
      # still a material and that nothing else quietly depended on the refraction.
      - name: Install WebKit and Firefox
        run: pnpm exec playwright install --with-deps webkit firefox

      - name: Degraded-material tests
        run: pnpm test:fallback

      # Asks the packer what it would ship. A mistake here is only visible once the
      # tarball is on the registry, where it cannot be taken back.
      - name: Verify the tarball
        run: pnpm verify:package

      - name: Size report
        run: pnpm size

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            reports/
            test-results/
          retention-days: 14
