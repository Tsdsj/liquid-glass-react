name: Release

# Publishing is driven by the tag, never by a button. `pnpm version x.y.z && git push --follow-tags`
# is the whole release action; everything below is what the tag sets off.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub Release
  id-token: write   # to authenticate to npm as this workflow, and to sign the tarball

jobs:
  # The same job that guards main, reused rather than copied, so a tag can never be
  # verified by a weaker check than a pull request is.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ttqtt/liquid-glass-react
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs the OIDC support that landed in npm 11.5.1; the npm that
      # ships with Node 22 is older and would silently fall back to looking for a token.
      #
      # Pinned to a major, not `latest`. `latest` means the release toolchain can change on a
      # morning nobody touched this repository — which is what happened to 0.0.2: npm 12 turned
      # `npm pack --json` from an array into an object keyed by package name, and the tarball
      # gate died on it in the publish job, after the suite had passed and the environment had
      # been approved by hand. The gate reads both shapes now, but a release should still be
      # reproducible, so moving this number is a decision somebody makes and tests.
      - name: Update npm for trusted publishing
        run: npm install -g npm@12

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Refuses to go on if the tag and the manifest disagree, or if the tarball would
      # ship source, miss an export, or lose the "use client" banner.
      - name: Verify the tarball against the tag
        run: pnpm verify:package
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      # A pre-release goes out under `next`, so nobody installing the package gets an
      # alpha because it happened to be the most recent thing published.
      - name: Choose the dist-tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then echo "dist=next" >> "$GITHUB_OUTPUT"; else echo "dist=latest" >> "$GITHUB_OUTPUT"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A version already on the registry is not an error to recover from — it is the answer.
      # npm refuses to overwrite one anyway, so re-running a release after a half-failed run,
      # or tagging a version that was published by hand, should carry on and cut the Release
      # rather than fail the job on a step that has nothing left to do.
      - name: Is this version already published?
        id: published
        run: |
          if npm view "@ttqtt/liquid-glass-react@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on the registry; skipping the publish step."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      # No token: npm mints a short-lived credential from this job's OIDC identity, which is
      # why the repository, this workflow file and the `npm` environment all have to match
      # what is registered as the package's trusted publisher. Provenance comes with it.
      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish --access public --tag ${{ steps.tag.outputs.dist }}

      # The release notes are the CHANGELOG section for this version — one source of truth,
      # so the two cannot describe the same release differently.
      - name: Cut the GitHub Release
        run: |
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## /{exit} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CHANGELOG.md 里没有 \"## $VERSION\" 这一节。" > notes.md
          args=()
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
